# Version updates are paused (open-pull-requests-limit: 0) until the release pipeline
# settles (agc-a1cq). To resume, delete the open-pull-requests-limit lines.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 3
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /vscode-extension
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 3
