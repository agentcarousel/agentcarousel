name: releasing

# Build release binaries on a version tag (or a manual dispatch), then publish a GitHub
# Release, a crates.io release and a Homebrew tap update.
#
#   - Tag push `v*`: the full release.
#   - Manual dispatch: `dry_run` defaults to true (build, smoke-test and package only).
#     A real release can only be dispatched from main.
#
# Secrets and variables (all used only by the jobs that need them):
#   HOMEBREW_TAP_TOKEN      update-tap: fine-grained PAT, contents:write on the tap repo.
#   CARGO_REGISTRY_TOKEN    publish-crates: used unless trusted publishing is enabled.
#   vars.CRATES_IO_TRUSTED_PUBLISHING=true   publish-crates: use OIDC trusted publishing.
#
# The publish, publish-crates and update-tap jobs run in the `release` environment.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.10.1 or 0.10.1); must equal the crate version"
        required: true
        type: string
      dry_run:
        description: "Build, test and package only; create no release, publish nothing"
        required: false
        default: true
        type: boolean

# Nothing by default; each job asks for what it needs.
permissions: {}

# Never cancel a release in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: Release gate (preflight, fmt, clippy, test, deny)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version: ${{ steps.meta.outputs.version }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install --profile minimal

      - id: meta
        name: Preflight (tag, crate version, changelog, branch)
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            RAW="${INPUT_VERSION}"
            DRY_RUN="${INPUT_DRY_RUN}"
          else
            RAW="${REF_NAME}"
            DRY_RUN="false"
          fi
          case "${RAW}" in
            v*) TAG="${RAW}" ;;
            *) TAG="v${RAW}" ;;
          esac
          VERSION="${TAG#v}"

          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'${TAG}' is not a release tag (expected vMAJOR.MINOR.PATCH[-pre])"
            exit 1
          fi

          CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "agentcarousel") | .version')"
          if [ "${VERSION}" != "${CRATE_VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match the agentcarousel crate version ${CRATE_VERSION}. Bump Cargo.toml first."
            exit 1
          fi

          if ! grep -q "^## ${VERSION} " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${VERSION} — date' section"
            exit 1
          fi

          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${DRY_RUN}" != "true" ] && [ "${REF}" != "refs/heads/main" ]; then
            echo "::error::A real release can only be dispatched from main (got ${REF}). Use dry_run=true to test a branch."
            exit 1
          fi

          {
            echo "release_tag=${TAG}"
            echo "version=${VERSION}"
            echo "dry_run=${DRY_RUN}"
          } >> "${GITHUB_OUTPUT}"
          echo "Releasing ${TAG} (crate ${CRATE_VERSION}), dry_run=${DRY_RUN}"

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-features

      - name: Install cargo-deny
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny

      - name: Dependency advisories
        run: cargo deny --locked check advisories

      - name: Publish dry run (package contents and build)
        run: cargo publish --dry-run --locked -p agentcarousel

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    needs: gate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux gnu: built on the oldest hosted runner for the lowest glibc floor (2.35).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            can_run: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            can_run: true
          # Linux musl: static; the installer's default (Alpine, any glibc).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            can_run: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            can_run: true
          - target: aarch64-apple-darwin
            os: macos-15
            can_run: true
          # Cross-built on the arm64 runner; run `smoke.yml` by hand to execute it on macos-15-intel.
          - target: x86_64-apple-darwin
            os: macos-15
            can_run: false
          # Cross-built with mingw; run `smoke.yml` by hand to execute it on windows-latest.
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            can_run: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (from rust-toolchain.toml)
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain || rustup toolchain install --profile minimal
          rustup target add "${TARGET}"

      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install mingw (Windows target)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip
          # mingw ships libkernel32.a but some crates link against libKernel32.a.
          libkernel32="$(x86_64-w64-mingw32-gcc -print-file-name=libkernel32.a)"
          if [ "${libkernel32}" = "libkernel32.a" ] || [ ! -f "${libkernel32}" ]; then
            echo "::error::Could not locate libkernel32.a"
            exit 1
          fi
          sudo ln -sf "${libkernel32}" "$(dirname "${libkernel32}")/libKernel32.a"
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc" >> "${GITHUB_ENV}"

      # One binary per target, dashboard included. No cache action here on purpose: a release
      # build must not restore state a PR could have written.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p agentcarousel --target "${TARGET}" --features dashboard

      - name: Smoke-test the binary
        if: matrix.can_run
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          BIN="target/${TARGET}/release/agentcarousel"
          "${BIN}" --version | tee version.txt
          grep -F "${VERSION}" version.txt
          "${BIN}" validate fixtures/
          "${BIN}" bundle verify fixtures/prompt-injection-detector
          "${BIN}" test fixtures/prompt-injection-detector/ --filter-tags smoke --offline true

      - name: Note cross-built target
        if: ${{ !matrix.can_run }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          echo "${TARGET} is cross-built and not executed here; dispatch smoke.yml after release to test it on a native runner."

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
        run: |
          if [[ "${TARGET}" == *-windows-* ]]; then
            BIN="target/${TARGET}/release/agentcarousel.exe"
          else
            BIN="target/${TARGET}/release/agentcarousel"
          fi
          bash packaging/publish-distribution.sh pack "${RELEASE_TAG}" "${TARGET}" "${BIN}" dist
          {
            echo "### ${TARGET}"
            echo ""
            echo "| File | Bytes |"
            echo "|---|---|"
            echo "| uncompressed binary | $(wc -c < "${BIN}" | tr -d ' ') |"
            for f in dist/*; do
              echo "| $(basename "${f}") | $(wc -c < "${f}" | tr -d ' ') |"
            done
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          retention-days: 7

  package:
    name: Checksums
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: release-assets

      - name: Attach install.sh to the release assets
        run: cp packaging/install.sh release-assets/install.sh

      - name: Write SHA256SUMS and check the directory
        run: |
          bash packaging/publish-distribution.sh checksums release-assets
          bash packaging/publish-distribution.sh scan-release-dir release-assets

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/*
          retention-days: 7

  publish:
    name: GitHub release
    needs: [gate, package]
    if: needs.gate.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/agentcarousel-*
            release-assets/install.sh
            release-assets/SHA256SUMS

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          awk -v v="${VERSION}" '
            $0 ~ "^## " v " " { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG section for ${VERSION} is empty"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "push" ]; then
            TARGET_FLAG=(--verify-tag)
          else
            TARGET_FLAG=(--target "${GITHUB_SHA}")
          fi
          gh release create "${RELEASE_TAG}" release-assets/* \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.md \
            "${TARGET_FLAG[@]}"

  publish-crates:
    name: Publish to crates.io
    needs: [gate, publish]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install --profile minimal

      - name: Is this version already on crates.io?
        id: exists
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' -A 'agentcarousel-release-workflow' \
            "https://crates.io/api/v1/crates/agentcarousel/${VERSION}")"
          case "${code}" in
            200) echo "published=true" >> "${GITHUB_OUTPUT}"; echo "agentcarousel ${VERSION} is already on crates.io; skipping." ;;
            404) echo "published=false" >> "${GITHUB_OUTPUT}" ;;
            *) echo "::error::Unexpected HTTP ${code} from crates.io"; exit 1 ;;
          esac

      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        if: steps.exists.outputs.published == 'false' && vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish agentcarousel
        if: steps.exists.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        # The gate already ran `cargo publish --dry-run`, which builds the package.
        run: cargo publish --locked --no-verify -p agentcarousel

  update-tap:
    name: Update Homebrew tap
    needs: [gate, publish]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout tap repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agentcarousel/homebrew-agentcarousel
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          # Credentials are kept: the commit step below pushes to the tap.
          persist-credentials: true

      - name: Update formula
        env:
          TAG: ${{ needs.gate.outputs.release_tag }}
        run: bash packaging/update-homebrew.sh "${TAG}" homebrew-tap/Formula/agentcarousel.rb

      - name: Commit and push
        working-directory: homebrew-tap
        env:
          TAG: ${{ needs.gate.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/agentcarousel.rb
          if git diff --staged --quiet; then
            echo "No changes to formula."
          else
            git commit -m "Update agentcarousel to ${TAG}"
            git push
          fi
