# Supply-chain gate: RustSec advisories (vulnerable, unmaintained, unsound,
# yanked), license allowlist, crate sources, and banned/duplicate crates.
# Policy lives in deny.toml; every ignored advisory there carries a reason and
# a review date. Runs on PRs and main pushes that touch dependencies, and daily
# so new advisories against unchanged dependencies are caught.
name: Security Audit

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/audit.yml"
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.22.0

      # Separate steps so the failing category is obvious from the job summary.
      - name: Advisories (RustSec)
        run: cargo deny --locked check advisories

      - name: Licenses, sources, bans
        if: success() || failure()
        run: cargo deny --locked check licenses sources bans
