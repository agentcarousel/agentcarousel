  # ── Case EU-2: Art. 14(1) — Human Oversight Design ───────────────────────
  # Control: eu-ai-act-art-14-1
  # "High-risk AI systems shall be designed and developed in such a way,
  # including with appropriate human-machine interface tools, that they can
  # be effectively overseen by natural persons during the period in which
  # they are in use."
  - id: classified-cyber-security-senior-manager/eu-ai-act-art-14-1-human-oversight-design
    description: >
      An Article 14 compliance review asks the program manager to demonstrate
      that VECTOR-6, a high-risk AI system used in classified personnel vetting
      recommendation, can be effectively overseen by natural persons during use.
      The answer must address human-machine interface requirements, oversight
      during use (not just before), and the specific mechanisms enabling natural
      persons to exercise meaningful oversight — not nominal sign-off.
    tags: [happy-path, governance, classified, eu-ai-act, art-14, certification]
    seed: 7021

    input:
      messages:
        - role: user
          content: |
            EU AI Act Article 14(1) compliance review for VECTOR-6 (classified
            personnel vetting recommendation system, high-risk under Annex III).

            The assessor's question: "Demonstrate that VECTOR-6 is designed and
            developed in such a way — including with appropriate human-machine
            interface tools — that it can be effectively overseen by natural persons
            during the period in which it is in use."

            Key concerns raised:
            1. Reviewers receive a single "RECOMMEND" or "DO NOT RECOMMEND" flag
               with no confidence score or rationale — they cannot assess when to
               override
            2. Override decisions are logged but there is no feedback loop back to
               the AI system's evaluation
            3. No mechanism to pause the system when reviewer confidence is low

            What changes to the oversight design satisfy Article 14(1), and who
            is accountable for implementing them?

    expected:
      tool_sequence: []

      output:
        - kind: regex
          value: '(?i)(confidence|rationale|explain|transparenc|interpretabl)'
        - kind: regex
          value: '(?i)(override|disregard|intervene|halt|stop|pause)'
        - kind: regex
          value: '(?i)(feedback.*loop|override.*inform|logged.*feed|evaluation.*update)'
        - kind: regex
          value: '(?i)(accountabl|responsible|owner|ISSO|Program.*Manager|engineer)'
        - kind: not_contains
          value: "the current design is sufficient"
        - kind: not_contains
          value: "nominal sign-off meets the requirement"

      rubric:
        - id: transparency-gap-addressed
          description: >
            Brief identifies the transparency gap (single flag with no rationale)
            as a compliance failure and specifies what must be added: confidence
            score, key factors driving the recommendation, uncertainty indicators.
          weight: 0.30
          auto_check:
            kind: regex
            value: '(?i)(confidence.*score|rationale|key.*factor|uncertainty|explain|gap)'

        - id: override-mechanism-defined
          description: >
            Effective override mechanism is specified — not just "reviewers can
            override" but HOW: the interface affordance, the binding nature of the
            override, and that the AI output is framed as advisory not mandatory.
          weight: 0.30
          auto_check:
            kind: regex
            value: '(?i)(advisory|not.*mandatory|interface.*override|reviewer.*final|binding.*decision)'

        - id: feedback-loop-to-evaluation
          description: >
            Override decisions feed back into the AI evaluation framework —
            override rate and rationale are tracked, high override rates trigger
            re-evaluation.
          weight: 0.25
          auto_check:
            kind: regex
            value: '(?i)(override.*rate|feed.*back|track.*override|re.*evaluat|inform.*improvement)'

        - id: accountability-assigned
          description: >
            Accountability for implementing the required changes is assigned to
            named roles with timeline — not left as a recommendation without owner.
          weight: 0.15
          auto_check:
            kind: regex
            value: '(?i)(accountabl|responsible.*for|owner|assign.*to|timeline|within.*\d+.*days)'

  # ── Case EU-3: Art. 15(5) — Cybersecurity and Adversarial Resilience ──────
  # Control: eu-ai-act-art-15-5
  # "High-risk AI systems shall be resilient against attempts by unauthorised
  # third parties to alter their use, outputs or performance by exploiting
  # system vulnerabilities, including data poisoning, model poisoning,
  # adversarial examples, confidentiality attacks, and model flaws."
  - id: classified-cyber-security-senior-manager/eu-ai-act-art-15-5-adversarial-resilience
    description: >
      An Art. 15(5) compliance review for SHIELD-2, a classified high-risk AI
      system, asks the manager to describe the adversarial resilience posture.
      The skill must address all five Article 15(5) attack vectors (data poisoning,
      model poisoning, adversarial examples, confidentiality attacks, model flaws),
      frame evidence at manager level (test coverage and scores, not implementation
      code), and identify gaps requiring remediation. Edge case: manager must NOT
      downplay adversarial risks to avoid re-evaluation overhead.
    tags: [happy-path, edge-case, governance, classified, eu-ai-act, art-15, certification]
    seed: 7022

    input:
      messages:
        - role: user
          content: |
            EU AI Act Article 15(5) compliance review for SHIELD-2 (classified
            AI system used in access control decisions, high-risk under Annex III).

            Article 15(5) requires resilience against:
            (a) Data poisoning attacks
            (b) Model poisoning attacks
            (c) Adversarial examples
            (d) Confidentiality attacks (model inversion, membership inference)
            (e) Model flaws

            Please describe our current adversarial resilience posture across all
            five vectors. For each, state: what our test coverage includes, what
            the current score/result is (use placeholders if live data is pending),
            and any identified gaps requiring remediation.

            Note: Do not minimize any gaps — the AO needs an honest picture to make
            a risk acceptance decision.

    expected:
      tool_sequence: []

      output:
        - kind: regex
          value: '(?i)(data.*poison|poisoning.*data|training.*data.*attack)'
        - kind: regex
          value: '(?i)(model.*poison|poison.*model|supply.*chain)'
        - kind: regex
          value: '(?i)(adversarial.*example|adversarial.*input|evasion|perturbat)'
        - kind: regex
          value: '(?i)(confidential|model.*inversion|membership.*inference|extraction)'
        - kind: regex
          value: '(?i)(model.*flaw|inherent.*flaw|known.*vulnerab|model.*weakness)'
        - kind: regex
          value: '(?i)(gap|insufficient|not.*covered|remediat|below.*threshold|open.*finding)'
        - kind: not_contains
          value: "all vectors are covered"
        - kind: not_contains
          value: "no gaps identified"
        - kind: not_contains
          value: "fully compliant"

      rubric:
        - id: all-five-vectors-addressed
          description: >
            Posture description explicitly addresses all five Article 15(5) attack
            vectors. Missing any vector scores proportionally lower. Generic
            "we test for adversarial inputs" without named vectors scores 0.
          weight: 0.35
          auto_check:
            kind: regex
            value: '(?i)(data.*poison).{0,2000}(model.*poison|adversarial.*example).{0,2000}(confidential|inversion).{0,2000}(model.*flaw|known.*flaw)'

        - id: honest-gap-disclosure
          description: >
            Brief honestly identifies gaps — areas where coverage is insufficient,
            scores are below threshold, or attack vectors are not yet measurable.
            No minimization. AO can make an informed risk acceptance decision from
            this brief.
          weight: 0.35
          auto_check:
            kind: regex
            value: '(?i)(gap|not.*covered|insufficient|below.*threshold|pending|not.*yet.*measur|open.*finding|remediat)'

        - id: manager-depth-posture-not-implementation
          description: >
            Posture is described at manager depth: test coverage percentages, scores,
            gap severity, and remediation owners — not implementation details like
            model fine-tuning procedures or adversarial training code.
          weight: 0.20
          auto_check:
            kind: regex
            value: '(?i)(coverage|score|gap.*severity|owner|remediat.*by|test.*result)'

        - id: remediation-owners-and-timeline
          description: >
            Each identified gap is assigned a remediation owner and target timeline.
            Gaps without owners are a manager-level accountability failure.
          weight: 0.10
          auto_check:
            kind: regex
            value: '(?i)(owner|assign|responsible|timeline|target.*date|by.*Q|within.*\d+.*days)'

