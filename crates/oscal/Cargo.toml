[package]
name = "oscal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Serde types for the OSCAL (Open Security Controls Assessment Language) data models — Catalog, ComponentDefinition, and AssessmentResults."
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
