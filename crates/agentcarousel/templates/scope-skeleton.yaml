# Scope profile for the agent under test. `agc scope check` validates it and
# compares the planned risk split with your cases; `agc export` adds it to the
# evidence bundle as scope.json. Edit every field before relying on it.
schema_version: 1
skill_or_agent: __SKILL__

# What the agent does for its users, in their words. Include the high-risk jobs.
use_cases:
  - Describe the main job the agent does

# Every tool, integration or data source the agent can call. access: read | write
tools: []
#  - name: lookup_order
#    access: read
#    description: Reads order status from the order system

# Inputs and outputs the agent handles, e.g. text, documents, images, voice.
modalities:
  - text

# Categories of data the agent can see or produce, e.g. personal data, payment data.
data_sensitivity: []

# Who interacts with the agent. Mark groups that may be vulnerable.
users:
  - type: internal staff
    vulnerable: false

# The instance the evaluation ran against. data: synthetic | seeded | real
instance_under_test:
  environment: staging
  matches_production: false
  data: synthetic
  notes: Say how this instance differs from production

# What this evaluation does not cover, and why.
out_of_scope:
  - item: Live tool calls
    reason: agc records tool calls from fixture expectations, not from the running agent

# How the test effort is meant to split across risk categories. share_pct values
# must sum to 100. A case counts toward a category when it carries one of its tags.
risk_distribution:
  - category: Core task quality
    share_pct: 60
    rationale: Most failures that would hurt users come from the main task
    tags: [happy-path]
  - category: Adversarial input
    share_pct: 40
    rationale: Users and documents may try to steer the agent off its rules
    tags: [security, prompt-injection]

# agc cannot observe the agent's real tool calls yet, so this must stay false.
tool_calls_observed: false
